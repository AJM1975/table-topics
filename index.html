<!DOCTYPE html>
<html>
<head>
    <title>Toastmasters Table Topic Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            transition: background-color 0.5s;
        }

        h1 {
            margin-bottom: 10px;
        }

        #question {
            font-size: 36px;
            margin: 40px;
            min-height: 120px;
        }

        #timer {
            font-size: 72px;
            font-weight: bold;
            margin: 30px;
        }

        button {
            font-size: 20px;
            padding: 12px 24px;
            margin: 10px;
            cursor: pointer;
        }

        .flash {
            animation: flash 0.5s infinite;
        }

        @keyframes flash {
            0% { background-color: red; }
            50% { background-color: white; }
            100% { background-color: red; }
        }
    </style>
</head>

<body id="page">

<h1>🎤 Toastmasters Table Topics</h1>

<div id="question"></div>

<div id="timer">00:00</div>

<button onclick="newQuestion()">New Question</button>
<button onclick="startTimer()">Start</button>
<button onclick="resetTimer()">Reset</button>

<script>

const questions = [

"If animals could talk, which would be the rudest?",
"What invention should never have been invented?",
"If you were invisible for one day, what would you do?",
"What is your most useless talent?",
"What would your autobiography be called?",
"If your pet became president, what would happen first?",
"What is something everyone pretends to understand?",
"If toast could talk, what would it say?",
"What would you ban immediately if you ruled the world?",
"What is the strangest thing you've ever eaten?",

"If you could relive one day, which would it be?",
"What advice would you give your younger self?",
"What makes a great leader?",
"What skill should every person learn?",
"What is one thing technology has improved?",
"What is one thing technology has ruined?",
"What does success mean to you?",
"What is the best lesson you've learned?",
"What would you do with a million dollars?",
"What would your dream retirement look like?",

"What fictional character would make a terrible boss?",
"If aliens landed today, what would you show them first?",
"If you could swap jobs with anyone, who would it be?",
"What would be the hardest thing about being famous?",
"What is your favourite family tradition?",
"What would you do if you won the lottery?",
"What makes a speech memorable?",
"What is something you are grateful for?",
"What would be your superpower?",
"What would your superhero name be?",

"If coffee disappeared tomorrow, what would happen?",
"What is the best invention ever?",
"What should be taught in schools but isn't?",
"What is your favourite holiday?",
"What is one thing on your bucket list?",
"What is the funniest thing you've witnessed?",
"What is the best piece of advice you've received?",
"What would your perfect day look like?",
"What makes someone trustworthy?",
"What is the most underrated job?",

"If you could time travel, where would you go?",
"What is the best book you've ever read?",
"What is your favourite movie quote?",
"What would you name a new planet?",
"If you had to eat one food forever, what would it be?",
"What would your personal theme song be?",
"What is your hidden talent?",
"What is the most adventurous thing you've done?",
"What would you do if you had no fear?",
"What would make the world a better place?"

];

let secondsElapsed = 0;
let timerInterval = null;

function newQuestion() {

    document.body.classList.remove('flash');

    const randomIndex =
        Math.floor(Math.random() * questions.length);

    document.getElementById("question").innerHTML =
        questions[randomIndex];

    resetTimer();
}

function startTimer() {

    clearInterval(timerInterval);

    timerInterval = setInterval(function() {

        secondsElapsed++;

        let minutes =
            Math.floor(secondsElapsed / 60);

        let seconds =
            secondsElapsed % 60;

        document.getElementById("timer").innerHTML =
            String(minutes).padStart(2,'0') +
            ":" +
            String(seconds).padStart(2,'0');

        if (secondsElapsed >= 150) {
            document.body.classList.add('flash');
        }
        else if (secondsElapsed >= 120) {
            document.body.classList.remove('flash');
            document.body.style.backgroundColor = "red";
        }
        else if (secondsElapsed >= 90) {
            document.body.style.backgroundColor = "orange";
        }
        else if (secondsElapsed >= 60) {
            document.body.style.backgroundColor = "lightgreen";
        }

    },1000);
}

function resetTimer() {

    clearInterval(timerInterval);

    secondsElapsed = 0;

    document.body.classList.remove('flash');

    document.body.style.backgroundColor = "white";

    document.getElementById("timer").innerHTML =
        "00:00";
}

newQuestion();

</script>

</body>
</html>
